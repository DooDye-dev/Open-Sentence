<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSentence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #FAFAF8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1A1816;
    }

    .scene {
      width: 320px;
      height: 140px;
      perspective: 800px;
      overflow: hidden;
      border-radius: 10px;
    }

    .cylinder {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s ease-in-out;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      font-weight: 700;
      color: white;
      backface-visibility: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    .label {
      font-size: 14px;
      color: #8B93A3;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #E5D5CF;
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot.active {
      background: #5B8CFF;
      width: 24px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>OpenSentence</h1>
    <div class="scene">
      <div class="cylinder" id="cylinder"></div>
    </div>
    <p class="label" id="label">Français</p>
    <div class="dots" id="dots"></div>
  </div>

  <script>
    const data = [
      { text: "Bonjour", lang: "Français", color: "#5B8CFF" },
      { text: "Hello", lang: "English", color: "#37C9A1" },
      { text: "Hola", lang: "Español", color: "#FF9500" },
      { text: "Hallo", lang: "Deutsch", color: "#E5566D" },
      { text: "Ciao", lang: "Italiano", color: "#8B5CF6" },
      { text: "早上好", lang: "Chinese", color: "#7B0B87" }
    ];

    const n = data.length;
    const angleStep = 360 / n; // 72deg entre chaque face
    const width = 320;
    // rayon du cylindre pour que les faces se touchent sans se chevaucher
    const radius = Math.round((width / 2) / Math.tan(Math.PI / n));

    const cylinder = document.getElementById("cylinder");
    const label = document.getElementById("label");
    const dotsContainer = document.getElementById("dots");

    // Créer les 5 faces, chacune positionnée autour du cylindre
    data.forEach((item, i) => {
      const face = document.createElement("div");
      face.className = "face";
      face.textContent = item.text;
      face.style.backgroundColor = item.color;
      face.style.transform = `rotateX(${i * angleStep}deg) translateZ(${radius}px)`;
      cylinder.appendChild(face);
    });

    // Créer les dots
    data.forEach((_, i) => {
      const dot = document.createElement("span");
      dot.className = i === 0 ? "dot active" : "dot";
      dot.onclick = () => goTo(i);
      dotsContainer.appendChild(dot);
    });

    let index = 0;

    function goTo(i) {
      index = i;
      // On tourne le cylindre pour amener la face i face à nous
      cylinder.style.transform = `rotateX(${-i * angleStep}deg)`;
      label.textContent = data[i].lang;
      document.querySelectorAll(".dot").forEach((d, di) => {
        d.classList.toggle("active", di === i);
      });
    }

    setInterval(() => {
      goTo((index + 1) % n);
    }, 2000);

    goTo(0);
  </script>
</body>
</html>
