<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenSentence</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }

    h1 {
      font-size: 52px;
      font-weight: 700;
      color: #1A1816;
    }

    .scene {
      width: 500px;
      height: 140px;
      perspective: 800px;
      overflow: hidden;
    }

    .cylinder {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.2s;
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 700;
      color: white;
      backface-visibility: hidden;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>OpenSentence</h1>
    <div class="scene">
      <div class="cylinder" id="cylinder"></div>
    </div>
  </div>

  <script>
    const data = [
      { text: "Bonjour", lang: "Français", color: "#5B8CFF" },
      { text: "Hello", lang: "English", color: "#37C9A1" },
      { text: "Hola", lang: "Español", color: "#FF9500" },
      { text: "Hallo", lang: "Deutsch", color: "#E5566D" },
      { text: "Ciao", lang: "Italiano", color: "#8B5CF6" },
      { text: "早上好", lang: "Chinese", color: "#7B0B87" }
    ];

    const n = data.length;
    const angleStep = 360 / n; // 72deg entre chaque face
    const width = 320;
    // rayon du cylindre pour que les faces se touchent sans se chevaucher
    const radius = Math.round((width / 2) / Math.tan(Math.PI / n));

    const cylinder = document.getElementById("cylinder");

    // Créer les 5 faces, chacune positionnée autour du cylindre
    data.forEach((item, i) => {
      const face = document.createElement("div");
      face.className = "face";
      face.textContent = item.text;
      face.style.backgroundColor = "#ffffff";
      face.style.color = item.color;
      face.style.transform = `rotateX(${i * angleStep}deg) translateZ(${radius}px)`;
      cylinder.appendChild(face);
    });

    index = 0;

    function goTo(i) {
      index = i;
      const displayIndex = index % n;

      cylinder.style.transform = `rotateX(${-index * angleStep}deg)`;
    }

    let turns = 0;

    const loop = setInterval(() => {
      goTo(index + 1);

      if (index % n === 0 && index !== 0) {
        turns++;
      }

      if (turns === 3) {
        const displayIndex = index % n;
        cylinder.children[displayIndex].textContent = "Why not ? Free & Open Source";
        clearInterval(loop);
      }
    }, 200);

  </script>
</body>
</html>
